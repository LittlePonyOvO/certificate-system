<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>基于 Hyperledger Fabric 的学业证书存证系统</title>
    <style>
        * {
            margin: 10px;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .box {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 12px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #1976D2;
        }
        #result {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-all;
        }
        .success {
            background: #e8f5e9 !important;
            border: 1px solid #81c784;
        }
        .error {
            background: #ffebee !important;
            border: 1px solid #ef5350;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 10px;
            font-size: 23px;
            text-align: center;
        }
        .group {
            text-align: center;
        }
        .logo {
            font-size: 23px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2><span class="logo">📜</span>基于Hyperledger Fabric的学业证书存证系统</h2>
        <h3 class="group">小组成员：吴敏晟 陈凯鑫 卢学城</h3>
        
        <!-- 证书存证模块 -->
        <div>
            <h3>1. 证书存证</h3>
            <input type="text" id="certId" placeholder="证书ID（如：CERT001）">
            <input type="text" id="name" placeholder="学生姓名">
            <input type="text" id="studentId" placeholder="学号">
            <input type="text" id="major" placeholder="专业">
            <input type="text" id="issueTime" placeholder="颁发时间（如：2026-06-20）">
            <input type="text" id="hash" placeholder="证书哈希值">
            <button onclick="uploadCertificate()">提交存证</button>
        </div>
        <hr>
        
        <!-- 证书查询模块 -->
        <div>
            <h3>2. 查询证书</h3>
            <input type="text" id="queryId" placeholder="输入证书ID查询">
            <button onclick="queryCertificate()">查询证书</button>
        </div>
        
        <!-- 结果显示 -->
        <div id="result" style="display:none;"></div>
    </div>

    <script>
        // 显示结果
        function showResult(message, isSuccess) {
            var result = document.getElementById('result');
            result.innerHTML = message;
            result.style.display = 'block';
            result.className = isSuccess ? 'success' : 'error';
        }

        // 上传证书
        async function uploadCertificate() {
            var certId = document.getElementById('certId').value;
            var name = document.getElementById('name').value;
            var studentId = document.getElementById('studentId').value;
            var major = document.getElementById('major').value;
            var issueTime = document.getElementById('issueTime').value;
            var hash = document.getElementById('hash').value;

            if (!certId || !name || !studentId || !major || !issueTime || !hash) {
                showResult('请填写所有字段！', false);
                return;
            }

            try {
                showResult('正在提交存证...', true);
                
                var response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `certId=${encodeURIComponent(certId)}&name=${encodeURIComponent(name)}&studentId=${encodeURIComponent(studentId)}&major=${encodeURIComponent(major)}&issueTime=${encodeURIComponent(issueTime)}&hash=${encodeURIComponent(hash)}`
                });

                var text = await response.text();
                
                if (response.ok) {
                    showResult('✅ ' + text, true);
                    // 清空表单
                    document.getElementById('certId').value = '';
                    document.getElementById('name').value = '';
                    document.getElementById('studentId').value = '';
                    document.getElementById('major').value = '';
                    document.getElementById('issueTime').value = '';
                    document.getElementById('hash').value = '';
                } else {
                    showResult('❌ ' + text, false);
                }
            } catch (error) {
                showResult('❌ 请求失败：' + error.message, false);
            }
        }

        // 查询证书
        async function queryCertificate() {
            var certId = document.getElementById('queryId').value;

            if (!certId) {
                showResult('请输入证书ID！', false);
                return;
            }

            try {
                showResult('正在查询...', true);
                
                var response = await fetch('/query?certId=' + encodeURIComponent(certId));
                var text = await response.text();
                
                if (response.ok) {
                    // 尝试格式化JSON
                    try {
                        var json = JSON.parse(text);
                        text = JSON.stringify(json, null, 2);
                    } catch (e) {
                        // 不是JSON，保持原样
                    }
                    showResult('✅ 查询成功：\n' + text, true);
                } else {
                    showResult('❌ ' + text, false);
                }
            } catch (error) {
                showResult('❌ 请求失败：' + error.message, false);
            }
        }
    </script>
</body>
</html>
